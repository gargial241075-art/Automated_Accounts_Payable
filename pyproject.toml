[project]
name = "ap-workflow-env"
version = "1.0.0"
description = "Automated Accounts Payable Workflow OpenEnv Environment"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pydantic==2.10.4",
    "openai>=1.0.0",
    "requests>=2.28.0",
    "websockets>=12.0",
    "openenv-core>=0.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
server = "server.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]

[tool.openenv]
env_name = "ap_workflow_env"
entry = "server.app:app"
port = 7860
